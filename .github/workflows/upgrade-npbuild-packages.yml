name: upgrade npbuild packages 

on:
  workflow_dispatch:

  schedule:
    - cron: '0 12 * * 1'

jobs:
  find-upgradable-packages:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - run: ./upgrade-npbuild-packages

      - uses: actions/upload-artifact@v6
        with:
          name: upgradable-packages-${{ github.sha }}
          path: upgrade/

      - id: upgradable-packages
        run: |
          set -ex
          NAMES="$(cd upgrade && ls | jq -Rnc '[inputs]')"
          printf 'names=%s\n' "$NAMES" >> $GITHUB_OUTPUT

    outputs:
      names: ${{ steps.upgradable-packages.outputs.names }}


  upgrade:

    needs: find-upgradable-packages

    if: needs.find-upgradable-packages.outputs.names != ''

    strategy:

      fail-fast: false

      matrix:
        pkg: ${{ fromJson(needs.find-upgradable-packages.outputs.names) }}

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      CFLAGS_FOR_BUILD: -Doff64_t=off_t

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: upgradable-packages-${{ github.sha }}
          path: upgrade

      - id: upgrade-info
        run: cat upgrade/${{ matrix.pkg }} >> "$GITHUB_OUTPUT"

      ############################################################

      - run: sed -i "/package_info_${{ matrix.pkg }}()/,/^}/ s|^\([[:space:]]*PACKAGE_SRC_URL=\).*|\1'${{ steps.upgrade-info.outputs.SRC_URL_NEW }}'|" core/npbuild
      - run: sed -i "/package_info_${{ matrix.pkg }}()/,/^}/ s|^\([[:space:]]*PACKAGE_SRC_SHA=\).*|\1'${{ steps.upgrade-info.outputs.SRC_SHA_NEW }}'|" core/npbuild

      ############################################################

      - run: git diff

      ############################################################

      - id: ndk-pkg-package
        run: |
          case ${{ matrix.pkg }} in
            libtool|automake|autoconf)
              X=libsass
              ;;
            help2man)
              X=libpaper
              ;;
            texinfo)
              X=gindent
              ;;
            libz)
              X=rav1e
              ;;
            libopenssl)
              X=lynx
              ;;
            intltool|libexpat|perl_XML_Parser)
              X=libqalculate
              ;;
          esac
          printf 'NAMES=%s\n' "$X" >> "$GITHUB_OUTPUT"

      ############################################################

      - run: curl -LO https://raw.githubusercontent.com/leleliu008/ndk-pkg/master/ndk-pkg
      - run: chmod +x ndk-pkg

      - run: ./ndk-pkg about
      - run: ./ndk-pkg setup
      - run: ./ndk-pkg sysinfo
      - run: ./ndk-pkg update
      - run: ./ndk-pkg install ${{ steps.ndk-pkg-package.outputs.NAMES }}

      ############################################################

      - run: ./npbuild --uppm ~/.ndk-pkg/core/uppm ${{ matrix.pkg }}

      ############################################################

      - run: git config --global user.name  leleliu008
      - run: git config --global user.email leleliu008@gmail.com

      - run: git add npbuild
      - run: git commit -m 'update package ${{ matrix.pkg }} ${{ steps.upgrade-info.outputs.VERSION_OLD }} -> ${{ steps.upgrade-info.outputs.VERSION_NEW }}'
      - run: git pull --rebase=true
      - run: git push origin master
